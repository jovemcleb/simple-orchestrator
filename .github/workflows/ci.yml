name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        shell: pwsh
        run: |
          $files = gofmt -l .
          if ($files) { Write-Error "Arquivos sem gofmt:`n$files"; exit 1 }
      - name: go vet
        run: go vet ./...
      - name: go test
        run: go test ./...
      - name: install.ps1 parse
        shell: pwsh
        run: |
          $errs = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile("$PWD/install.ps1", [ref]$null, [ref]$errs)
          if ($errs) { $errs | ForEach-Object { Write-Error $_.Message }; exit 1 }
